services:
  n8n:
    image: n8nio/n8n:1.88.0
    container_name: lendloop-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${N8N_PROTOCOL:-http}://${N8N_HOST:-localhost}:${N8N_PORT:-5678}/
      - GENERIC_TIMEZONE=${N8N_TIMEZONE:-UTC}
      - TZ=${N8N_TIMEZONE:-UTC}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      # LendLoop automation runtime env vars (never hardcoded inside workflow JSONs)
      - LENDLOOP_HMAC_SECRET=${LENDLOOP_HMAC_SECRET:?Set LENDLOOP_HMAC_SECRET in .env}
      - CONVEX_SITE_URL=${CONVEX_SITE_URL:-http://host.docker.internal:3000}
      - NOTIFICATION_SINK_URL=${NOTIFICATION_SINK_URL:-https://httpbin.org/post}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-https://httpbin.org/post}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/lendloop-workflows:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  n8n_data:
